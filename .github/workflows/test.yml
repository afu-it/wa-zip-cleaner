name: test
on:
  push:
  workflow_dispatch:
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\run-e2e.ps1
